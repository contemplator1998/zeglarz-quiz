<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<title>Żeglarz Jachtowy — Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:#0a1628;color:#e8e8e8;min-height:100vh;padding:12px}
.screen{display:none;max-width:600px;margin:0 auto}
.screen.active{display:block}
h1{font-size:1.4em;text-align:center;padding:16px 0;color:#4fc3f7}
.cat-btn{display:block;width:100%;padding:14px 16px;margin:8px 0;background:#1a2a44;border:1px solid #2a4a6a;border-radius:10px;color:#e8e8e8;font-size:1em;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cat-btn:active{background:#2a4a6a}
.cat-btn .count{float:right;color:#4fc3f7;font-size:.85em}
.progress{background:#1a2a44;border-radius:8px;height:6px;margin:12px 0;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#4fc3f7,#29b6f6);transition:width .3s;border-radius:8px}
.q-num{color:#78909c;font-size:.85em;margin-bottom:8px}
.q-text{font-size:1.05em;line-height:1.5;margin-bottom:16px;font-weight:600}
.answer{display:block;width:100%;padding:14px 16px;margin:6px 0;background:#1a2a44;border:2px solid #2a4a6a;border-radius:10px;color:#e8e8e8;font-size:.95em;text-align:left;cursor:pointer;line-height:1.4;-webkit-tap-highlight-color:transparent;transition:all .2s}
.answer:active{transform:scale(.98)}
.answer.correct{border-color:#4caf50;background:#1b3a1b;color:#a5d6a7}
.answer.wrong{border-color:#f44336;background:#3a1b1b;color:#ef9a9a}
.answer.highlight{border-color:#4caf50;background:#1b3a1b}
.answer:disabled{cursor:default;opacity:.85}
.next-btn{display:none;width:100%;padding:14px;margin:16px 0;background:#29b6f6;border:none;border-radius:10px;color:#0a1628;font-size:1em;font-weight:700;cursor:pointer}
.next-btn:active{background:#4fc3f7}
.back-btn{background:none;border:none;color:#4fc3f7;font-size:.95em;cursor:pointer;padding:8px 0;margin-bottom:8px}
.stats{text-align:center;padding:20px 0}
.stats .score{font-size:2.5em;font-weight:700;color:#4fc3f7}
.stats .label{color:#78909c;margin-top:4px}
.stats-bar{display:flex;gap:8px;justify-content:center;margin:20px 0}
.stat-box{background:#1a2a44;border-radius:10px;padding:12px 20px;text-align:center}
.stat-box .num{font-size:1.5em;font-weight:700}
.stat-box.good .num{color:#4caf50}
.stat-box.bad .num{color:#f44336}
.mode-btns{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.mode-btn{flex:1;padding:10px;background:#1a2a44;border:1px solid #2a4a6a;border-radius:8px;color:#e8e8e8;font-size:.85em;cursor:pointer;text-align:center;min-width:80px}
.mode-btn.active{border-color:#4fc3f7;color:#4fc3f7}
</style>
</head>
<body>

<div id="menu" class="screen active">

</div>
<div id="catList"></div>
</div>

<div class="q-text" id="qtext"></div>
<div id="answers"></div>
<button class="next-btn" id="nextBtn" onclick="nextQ()">Następne →</button>
</div>

<div id="result" class="screen">

<div class="score" id="scoreText"></div>

<button class="cat-btn" onclick="retry()" style="text-align:center;border-color:#4fc3f7">🔄 Powtórz błędne</button>
<button class="cat-btn" onclick="showMenu()" style="text-align:center">← Menu</button>
</div>

": "RATOWNICTWO", "question": "Jaką procedurę powinien przyjąć skipper lekkiego jachtu żaglowego, spodziewając się w ciągu kilku minut uderzenia bardzo silnego szkwału?", "answers": ["zrzucić foka, kontynuować żeglugę na samym grocie i silniku do najbliższego portu schronienia,", "postawić jacht w dryf, wcześniej redukując powierzchnię ożaglowania,", "płynąć jak najszybciej pod żaglami i na silniku do najbliższego brzegu, tam zrzucić żagle", "wszystkie powyższe odpowiedzi są prawidłowe"], "correct": "4"}, {"category": "RATOWNICTWO", "question": "W warunkach rejsu po wodach śródlądowych do gaszenia rozlanej na pokładzie palącej się benzyny, należy zastosować:", "answers": ["gaśnicę proszkową,", "koc gaśniczy lub piasek,", "wodę zaburtową obficie polewaną z wiadra"], "correct": "1"}, {"category": "RATOWNICTWO", "question": "Jaką taktykę przyjmiesz prowadząc jacht płynący ostrym bajdewindem, na środku dużego jeziora, gdy stwierdzisz pod pokładem gwałtownie rozprzestrzeniający się pożar?", "answers": ["postawić jacht w dryfie, natychmiast ewakuować załogę w kamizelkach do wody,", "zmienić kurs na baksztag, uruchomić silnik, natychmiast przystąpić do gaszenia pożaru,", "zrzucić żagle, wyłączyć silnik, wzywać na pomoc WOPR i straż pożarną,"], "correct": "2"}, {"category": "PRZEPISY", "question": "Osoba posiadająca patent żeglarza jachtowego jest uprawniona do prowadzenia jachtów żaglowych:", "answers": ["bez ograniczenia akwenu, w tym po morskiej strefie przybrzeżnej (do 6 Mm) na jachtach o długości kadłuba do 20 m,", "po wodach śródlądowych; a po morskich wodach wewnętrznych oraz pozostałych wodach morskich w strefie 2 Mm od brzegu, na jachtach o długości do 12 m, w porze dziennej,", "po wodach śródlądowych stojących (w dzień i w nocy); a po wodach morskich na jachtach o długości kadłuba do 8,5 m,"], "correct": "2"}, {"category": "PRZEPISY", "question": "Osoba posiadająca patent żeglarza jachtowego uprawniona jest do prowadzenia łodzi żaglowej z pomocniczym napędem mecha   CATS.forEach(c=>{
    let n=ALL.filter(q=>q.category===c).length;
    h+=`<button class="cat-btn" onclick="startCat('${c.replace(/'/g,"\\'")}')">${c}<span class="count">${n} pytań</span></button>`;
  });
  document.getElementById('catList').innerHTML=h;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}}

function startCat(c){startQuiz(ALL.filter(q=>q.category===c));}

function startQuiz(arr){
  qs=arr;qi=0;good=0;bad=0;wrongQs=[];answered=false;
  show('quiz');renderQ();
}

function renderQ(){
  answered=false;
  let q=qs[qi];
  document.getElementById('pbar').style.width=((qi/qs.length)*100)+'%';
  document.getElementById('qnum').textContent=q.category+' — '+(qi+1)+' / '+qs.length;
  document.getElementById('qtext').textContent=q.question;
  let h='';
  q.answers.forEach((a,i)=>{
    h+=`<button class="answer" onclick="pick(this,${i+1})">${a}</button>`;
  });
  document.getElementById('answers').innerHTML=h;
  document.getElementById('nextBtn').style.display='none';
}

function pick(el,idx){
  if(answered)return;answered=true;
  let q=qs[qi],ci=parseInt(q.correct);
  let btns=document.querySelectorAll('.answer');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i+1===ci)b.classList.add(idx===ci?'correct':'highlight');
  });
  if(idx===ci){el.classList.add('correct');good++;}
  else{el.classList.add('wrong');bad++;wrongQs.push(q);}
  document.getElementById('nextBtn').style.display='block';
}

function nextQ(){
  qi++;
  if(qi>=qs.length){showResult();}
  else{renderQ();}
}

function showResult(){
  show('result');
  document.getElementById('scoreText').textContent=good+' / '+qs.length;
  document.getElementById('goodN').textContent=good;
  document.getElementById('badN').textContent=bad;
}

function retry(){if(wrongQs.length){startQuiz(wrongQs);}else{showMenu();}}
function showMenu(){show('menu');setMode('cat');}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

renderCats();
</script>
